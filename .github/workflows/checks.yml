name: checks

defaults:
  run:
    shell: bash

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 13 * * 4'
  release:
    types: [published]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v5
    - run: |
        pip install .
        pip install pylint
        pylint --unsafe-load-any-extension=y --disable=fixme $(git ls-files '*.py')

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v1
      - run: |
          pip install .
          pip install pre-commit
          pre-commit clean
          pre-commit autoupdate
          pre-commit run --files $(git ls-files | grep -v tests/examples/bad.ipynb)

  selftest:
    needs: [pylint, precommit]
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pytest -vv -rP -We . -k "not test_todos_annotated"

  check-todos:
    uses: AgnieszkaZaba/devops_tests/.github/workflows/check-todos.yml@todos
    permissions:
      contents: read
      issues: read
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
